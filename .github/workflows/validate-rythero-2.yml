name: Validate Rythero 2

on:
  push:
    branches:
      - rythero-2-big-update-2026-09-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Validate generated site
        run: npm run validate:site
